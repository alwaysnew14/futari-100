<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171322"><title>ふたりの知らない100のこと｜無料体験</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#171322,#34233d);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;display:grid;place-items:center;padding:22px}.app{width:min(100%,440px);text-align:center}.eyebrow{color:#f4c7d7;letter-spacing:.15em;font-size:12px}h1{font-size:27px;line-height:1.5;margin:14px 0 6px}.sub{font-size:13px;color:#d4c4cf}.card{width:100%;min-height:290px;border:1px solid #d59caf;border-radius:24px;background:linear-gradient(160deg,#583448,#32273e);box-shadow:0 16px 36px #0005;margin:28px 0 20px;padding:30px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;color:inherit}.num{font-size:12px;letter-spacing:.18em;color:#f7c8d4}.question{font-size:23px;font-weight:700;line-height:1.7;margin:26px 0}.hint{font-size:12px;color:#ddbfce}.controls{display:flex;gap:10px}button{font:inherit}.controls button{flex:1;padding:15px 10px;border-radius:14px;border:1px solid #bb8da8;background:#382b40;color:white;font-weight:600}.controls button:last-child{background:#e9a9c0;color:#241a28;border:0}.controls button:disabled{opacity:.35}.foot{font-size:12px;color:#cbbcc8;margin-top:22px;line-height:1.8}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head><body><main class="app"><div class="eyebrow">FOR TWO · FREE TRIAL</div><h1>ふたりの知らない<br>100のこと</h1><p class="sub">ふたりの距離が少し近づく、10の質問</p><button class="card" id="card" aria-label="次の質問へ"><span class="num" id="num"></span><span class="question" id="question"></span><span class="hint">カードをタップして次へ</span></button><div class="controls"><button id="prev">前の質問</button><button id="next">次の質問</button></div><p class="foot">無料体験版・全10問<br>答えたくない質問はスキップしてOK。回答は保存されません。</p></main><script>
const questions=['初めて会ったとき、私の第一印象は？','一緒に過ごした時間で、一番笑った瞬間は？','私の好きなところを3つ挙げるなら？','ふたりで今すぐ旅行できるなら、どこに行きたい？','私がまだ知らない、あなたの小さな夢は？','ふたりで新しく始めたいことは？','私に言われて嬉しかった言葉は？','10年後、どんなふたりでいたい？','もし出会った日に戻れるなら、私に何と言う？','今、私に伝えたいことは？'];let index=0;const num=document.getElementById('num'),q=document.getElementById('question'),prev=document.getElementById('prev'),next=document.getElementById('next');function render(){num.textContent=`QUESTION ${String(index+1).padStart(2,'0')} / 10`;q.textContent=questions[index];prev.disabled=index===0;next.textContent=index===questions.length-1?'最初に戻る':'次の質問'}function forward(){index=(index+1)%questions.length;render()}prev.addEventListener('click',()=>{if(index>0){index--;render()}});next.addEventListener('click',forward);document.getElementById('card').addEventListener('click',forward);render();
</script></body></html>
